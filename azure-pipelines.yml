# Docker
# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
- main

resources:
- repo: self

variables:
  # Container registry service connection established during pipeline creation
  dockerRegistryServiceConnection: '383e4c9c-ba45-4bfa-ad93-b96d1eaaf8e5'
  imageRepository: 'akdvl'
  containerRegistry: 'akdocker1.azurecr.io'
  dockerfilePath: '**/Dockerfile'
  tag: '$(Build.BuildId)'

  # Agent VM image name
  vmImageName: 'ubuntu-latest'

stages:
- stage: Build
  displayName: Build and push stage
  jobs:
  - job: Build
    displayName: Build
    pool:
      vmImage: $(vmImageName)
    steps:
    - task: Docker@2
      displayName: Build and push an image to container registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        dockerfile: $(dockerfilePath)
        containerRegistry: $(dockerRegistryServiceConnection)
        tags: |
          $(tag)
- stage: Deploy
  displayName: Deploy
  jobs:
   - job: Deploy
     displayName: Deploy
     steps:
     - task: AzureRmWebAppDeployment@3
       inputs:
         azureSubscription: 'Azure subscription 1(7c2f1abe-b0ed-4ce4-9d60-e1bc0465507b)'
         appType: 'applinux'
         WebAppName: 'dockerak'
         DockerNamespace: '$(containerRegistry)'
         DockerRepository: '$(imageRepository)'
         DockerImageTag: '$(Build.BuildId)'
         WebAppUri: 'WebAppUri'
